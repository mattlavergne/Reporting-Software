<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Report Manager{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<header><a class="brand" href="/">Report Manager</a>
{% if user %}<nav><a href="/">Reports</a><a href="/runs">Run history</a>
{% if user.role != 'viewer' %}<a href="/jobs">Scheduled jobs</a><a href="/reports/new">+ New report</a>{% endif %}
{% if user.role == 'admin' %}<a href="/admin/users">Users</a><a href="/admin/connections">Connections</a>{% endif %}</nav>
<form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}">{{ user.username }} ({{ user.role }}) <button class="link">Sign out</button></form>{% endif %}</header>
<main>{% block body %}{% endblock %}</main></html>
