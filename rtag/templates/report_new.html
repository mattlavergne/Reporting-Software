{% extends "base.html" %}{% block body %}
<h1>New report</h1>
<form method="post" action="/reports" enctype="multipart/form-data" class="stack">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Name <input name="name" required></label>
<label>Type <select name="kind">{% for k in kinds %}<option>{{ k }}</option>{% endfor %}</select></label>
<label>Category <input name="category"></label>
<label>Description <textarea name="description" rows="2"></textarea></label>
<label>Database connection (SQL reports) <select name="connection_id"><option value="">-</option>{% for c in conns %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label>
<label>Parameters <small>one per line: name | label | default. SQL uses :name</small><textarea name="params" rows="3" placeholder="start_date | Start date | 2025-01-01"></textarea></label>
<label>SQL text (SQL) / SSRS path+query e.g. <code>/Sales/Monthly</code> (SSRS) <textarea name="source" rows="8" class="mono"></textarea></label>
<label>.rpt file (Crystal) <input type="file" name="file" accept=".rpt"></label>
<label>Version note <input name="note" value="Initial version"></label>
<button>Create</button></form>{% endblock %}
