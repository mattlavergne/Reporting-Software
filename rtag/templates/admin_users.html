{% extends "base.html" %}{% block body %}
<h1>Users</h1><table><tr><th>User</th><th>Email</th><th>Role</th><th>Active</th><th>Reset password</th><th></th></tr>
{% for x in users %}<tr><form method="post" action="/admin/users"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="username" value="{{ x.username }}">
<td>{{ x.username }}</td><td><input name="email" value="{{ x.email }}"></td><td><select name="role">{% for ro in roles %}<option {{ 'selected' if ro==x.role }}>{{ ro }}</option>{% endfor %}</select></td>
<td><input type="checkbox" name="active" value="1" {{ 'checked' if x.active }}></td><td><input name="password" type="password" placeholder="(unchanged)"></td><td><button>Save</button></td></form></tr>{% endfor %}</table>
<h2>Add user</h2><form method="post" action="/admin/users" class="stack narrow"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username<input name="username" required></label><label>Email<input name="email"></label>
<label>Role<select name="role">{% for ro in roles %}<option {{ 'selected' if ro=='viewer' }}>{{ ro }}</option>{% endfor %}</select></label>
<label>Password (10+ chars)<input name="password" type="password" required></label><input type="hidden" name="active" value="1"><button>Add</button></form>{% endblock %}
